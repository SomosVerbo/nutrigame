<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NutriGame - Novo endereço</title>
  <link rel="canonical" href="https://nutrianaluisarocha.com/nutrigame/">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: #FAF8F9; color: #2C3338; font-family: system-ui, sans-serif; font-weight: 600; text-align: center; }
    a { color: #7A0043; }
  </style>
</head>
<body>
  <p>O NutriGame mudou de endereço. Levando seu progresso...<br><br><a id="ir" href="https://nutrianaluisarocha.com/nutrigame/">Abrir o jogo</a></p>
  <script>
    // O localStorage é por domínio: o save de quem jogou aqui segue no link para o endereço novo.
    var destino = "https://nutrianaluisarocha.com/nutrigame/";
    var salvo = null;
    try { salvo = localStorage.getItem("nutri_game_state"); } catch (e) {}
    if (salvo) destino += "restaurar/#importar=" + encodeURIComponent(salvo);
    document.getElementById("ir").href = destino;
    location.replace(destino);
  </script>
</body>
</html>
